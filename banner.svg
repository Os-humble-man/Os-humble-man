<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Oscar Kanangila — Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#13233F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- Left: identity -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="104" fill="#94A3B8" font-size="20" letter-spacing="4">HELLO, I'M</text>
    <text x="72" y="164" fill="#F8FAFC" font-size="58" font-weight="700">Oscar Kanangila</text>
    <rect x="72" y="184" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="226" fill="#CBD5E1" font-size="24">Software Developer · Full-stack web &amp; mobile</text>
    <text x="72" y="260" fill="#64748B" font-size="18">Lubumbashi, DR Congo</text>
  </g>

  <!-- Right: code card -->
  <g transform="translate(760 62)">
    <rect width="372" height="176" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#1E3A5F"/>
    <circle cx="22" cy="22" r="6" fill="#F87171"/>
    <circle cx="42" cy="22" r="6" fill="#FBBF24"/>
    <circle cx="62" cy="22" r="6" fill="#34D399"/>
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="16">
      <text x="24" y="66"><tspan fill="#818CF8">const</tspan><tspan fill="#E2E8F0"> oscar = {</tspan></text>
      <text x="44" y="92"><tspan fill="#7DD3FC">stack</tspan><tspan fill="#E2E8F0">: [</tspan><tspan fill="#86EFAC">"TS"</tspan><tspan fill="#E2E8F0">, </tspan><tspan fill="#86EFAC">"React"</tspan><tspan fill="#E2E8F0">, </tspan><tspan fill="#86EFAC">"NestJS"</tspan><tspan fill="#E2E8F0">],</tspan></text>
      <text x="44" y="118"><tspan fill="#7DD3FC">builds</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">"SaaS &amp; AI apps"</tspan><tspan fill="#E2E8F0">,</tspan></text>
      <text x="44" y="144"><tspan fill="#7DD3FC">learning</tspan><tspan fill="#E2E8F0">: </tspan><tspan fill="#86EFAC">"AI &amp; Data"</tspan></text>
      <text x="24" y="166" fill="#E2E8F0">};</text>
    </g>
  </g>
</svg>
